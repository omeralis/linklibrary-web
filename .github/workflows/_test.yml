name: _test
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified upstream 2026-11-03
        with: { persist-credentials: false, ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; verified upstream 2026-11-03
        with: { node-version: '22.23.3', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check          # i18n:check + typecheck + lint + vitest
