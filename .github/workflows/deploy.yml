# Production deploys AUTOMATICALLY after a merge/push to main (only while repository variable DEPLOY_ENABLED is "true").
# Tests, deployment-security tests and the build run WITHOUT the production environment or SSH secrets; secrets exist only in the final job.
# Manual dispatch remains for rollback (explicit release id + typed authorization) and for re-running main HEAD.
name: Production web (auto on main)
'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
          - deploy
          - rollback
        required: true
      authorization:
        description: 'Rollback only: type "rollback linklibrary-web"'
        type: string
      release_id:
        description: Explicit known release ID; required for rollback
        type: string
permissions:
  contents: read
concurrency:
  group: linklibrary-production
  cancel-in-progress: false
jobs:
  authorize:
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.action == 'deploy' || inputs.authorization == 'rollback linklibrary-web') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Only the current tip of main may be deployed
        env:
          SHA: ${{ github.sha }}
          ACTION: ${{ inputs.action || 'deploy' }}
          RID: ${{ inputs.release_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$SHA" = "$(git rev-parse origin/main)"
          test "$SHA" = "$GITHUB_SHA"
          if [ "$ACTION" = rollback ]; then
            [[ "$RID" =~ ^([0-9]{8}-[0-9]{6}-(api|web)-[0-9a-f]{7}|[0-9]{8}-[0-9]{2})$ ]] || exit 1
          fi
  test:
    needs: authorize
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    uses: ./.github/workflows/_test.yml
    with:
      ref: ${{ github.sha }}
  deploy:
    needs:
      - authorize
      - test
      - build
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; upstream verified 2026-11-03
        with:
          name: approved-web-release
          path: ${{ runner.temp }}/ll-artifact
      - name: Verify opaque artifact before loading SSH credentials
        run: python3 -I deploy/verify-artifact.py
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ll-artifact
          SHA: ${{ github.sha }}
          COMPONENT: web
          PUBLIC_ORIGIN: ${{ vars.LL_PUBLIC_ORIGIN }}
      - name: Restricted SSH deploy with EXIT cleanup
        run: bash deploy/ssh-operation.sh
        env:
          KEY: ${{ secrets.LL_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.LL_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.LL_SSH_HOST }}
          PORT: ${{ vars.LL_SSH_PORT || '22' }}
          SSH_USER: ${{ vars.LL_SSH_USER }}
          ACTION: deploy
          COMPONENT: web
          SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/ll-artifact
      - name: Runner credential cleanup backstop
        if: always()
        run: bash deploy/cleanup-ssh.sh
  rollback:
    needs: authorize
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Explicit rollback target with EXIT cleanup
        run: bash deploy/ssh-operation.sh
        env:
          KEY: ${{ secrets.LL_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.LL_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.LL_SSH_HOST }}
          PORT: ${{ vars.LL_SSH_PORT || '22' }}
          SSH_USER: ${{ vars.LL_SSH_USER }}
          ACTION: rollback
          RID: ${{ inputs.release_id }}
      - name: Runner credential cleanup backstop
        if: always()
        run: bash deploy/cleanup-ssh.sh
  build:
    needs:
      - authorize
      - test
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; upstream verified 2026-11-03
        with:
          node-version: 22.23.3
          cache: npm
      - name: Build approved production artifact
        run: bash deploy/build-web.sh
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.LL_PUBLIC_ORIGIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.LL_PUBLIC_ORIGIN }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.LL_CONTACT_EMAIL }}
          FRONTEND_SERVER_KEY: LL_BUILD_PRIVATE_CANARY_6e047f27
          NODE_OPTIONS: '--max-old-space-size=4096'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; upstream verified 2026-11-03
        with:
          name: approved-web-release
          path: |
            release.tgz
            release.sha256
          retention-days: 1
          if-no-files-found: error
