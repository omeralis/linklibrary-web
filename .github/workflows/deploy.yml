# Production is manual-only; builds run without the production environment or SSH secrets.
name: Manual Production web
'on':
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
          - deploy
          - rollback
        required: true
      commit_sha:
        description: Full approved SHA; must equal current main (also required for rollback tooling)
        type: string
        required: true
      authorization:
        description: Type "deploy linklibrary-web" or "rollback linklibrary-web"
        type: string
        required: true
      release_id:
        description: Explicit known release ID; required for rollback
        type: string
      public_origin:
        description: Exact HTTPS origin; must match production LL_PUBLIC_ORIGIN
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: linklibrary-production
  cancel-in-progress: false
jobs:
  authorize:
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && inputs.authorization == format('{0} linklibrary-web', inputs.action) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact approved main SHA before using release code
        env:
          SHA: ${{ inputs.commit_sha }}
          ACTION: ${{ inputs.action }}
          RID: ${{ inputs.release_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$SHA" = "$(git rev-parse origin/main)"
          test "$SHA" = "$GITHUB_SHA"
          if [ "$ACTION" = rollback ]; then
            [[ "$RID" =~ ^([0-9]{8}-[0-9]{6}-(api|web)-[0-9a-f]{7}|[0-9]{8}-[0-9]{2})$ ]] || exit 1
          fi
  test:
    needs: authorize
    if: ${{ inputs.action == 'deploy' }}
    uses: ./.github/workflows/_test.yml
    with:
      ref: ${{ inputs.commit_sha }}
  deploy:
    needs:
      - authorize
      - test
      - build
    if: ${{ inputs.action == 'deploy' }}
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; upstream verified 2026-11-03
        with:
          name: approved-web-release
          path: ${{ runner.temp }}/ll-artifact
      - name: Verify opaque artifact before loading SSH credentials
        run: python3 -I deploy/verify-artifact.py
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ll-artifact
          SHA: ${{ inputs.commit_sha }}
          COMPONENT: web
          PUBLIC_ORIGIN: ${{ vars.LL_PUBLIC_ORIGIN }}
      - name: Restricted SSH deploy with EXIT cleanup
        run: bash deploy/ssh-operation.sh
        env:
          KEY: ${{ secrets.LL_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.LL_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.LL_SSH_HOST }}
          PORT: ${{ vars.LL_SSH_PORT || '22' }}
          SSH_USER: ${{ vars.LL_SSH_USER }}
          ACTION: deploy
          COMPONENT: web
          SHA: ${{ inputs.commit_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/ll-artifact
      - name: Runner credential cleanup backstop
        if: always()
        run: bash deploy/cleanup-ssh.sh
  rollback:
    needs: authorize
    if: ${{ inputs.action == 'rollback' }}
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - name: Explicit rollback target with EXIT cleanup
        run: bash deploy/ssh-operation.sh
        env:
          KEY: ${{ secrets.LL_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.LL_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.LL_SSH_HOST }}
          PORT: ${{ vars.LL_SSH_PORT || '22' }}
          SSH_USER: ${{ vars.LL_SSH_USER }}
          ACTION: rollback
          RID: ${{ inputs.release_id }}
      - name: Runner credential cleanup backstop
        if: always()
        run: bash deploy/cleanup-ssh.sh
  build:
    needs:
      - authorize
      - test
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; upstream verified 2026-11-03
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; upstream verified 2026-11-03
        with:
          node-version: 22.23.3
          cache: npm
      - name: Build approved production artifact
        run: bash deploy/build-web.sh
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.public_origin }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.public_origin }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.LL_CONTACT_EMAIL }}
          FRONTEND_SERVER_KEY: LL_BUILD_PRIVATE_CANARY_6e047f27
          NODE_OPTIONS: '--max-old-space-size=4096'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; upstream verified 2026-11-03
        with:
          name: approved-web-release
          path: |
            release.tgz
            release.sha256
          retention-days: 1
          if-no-files-found: error
