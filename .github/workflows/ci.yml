name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/_test.yml
  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.3', cache: npm}
      - name: Build and validate production artifact independently of deployment
        run: bash deploy/build-web.sh
        env:
          NEXT_PUBLIC_API_URL: https://linklibrary.invalid
          NEXT_PUBLIC_SITE_URL: https://linklibrary.invalid
          FRONTEND_SERVER_KEY: LL_BUILD_PRIVATE_CANARY_6e047f27
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release-${{ github.sha }}
          path: |
            release.tgz
            release.sha256
          retention-days: 7
