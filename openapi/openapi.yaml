        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: 'Session cookie for stateful SPA domains (plus XSRF-TOKEN / X-XSRF-TOKEN).'
    bearerToken:
      type: http
      scheme: bearer
      description: 'Sanctum personal access token (prefix ll_).'
  responses:
    Unauthenticated:
      description: 'Authentication required (code UNAUTHENTICATED)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden (FORBIDDEN, EMAIL_NOT_VERIFIED, ACCOUNT_SUSPENDED, LINK_SECURITY_BLOCKED…)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Not found or not accessible (NOT_FOUND)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 'Validation or domain rule failed (VALIDATION_ERROR, INVALID_URL, URL_NOT_ALLOWED, LINK_NOT_PUBLISHABLE, LINK_NOT_SHAREABLE…)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Conflict (ALREADY_SHARED, GRANT_CYCLE, ALREADY_OWNER, INVITATION_NOT_PENDING…)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Too many requests (RATE_LIMITED); see Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Envelope:
      type: object
      required:
        - success
      properties:
        success:
          const: true
        message:
          type:
            - string
            - 'null'
        data: []
        meta:
          type: object
    Error:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
    PaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            has_more:
              type: boolean
            total:
              type: integer
            last_page:
              type: integer
    Visibility:
      enum:
        - PRIVATE
        - PUBLIC
    SecurityStatus:
      enum:
        - PENDING
        - CLEAR
        - SUSPICIOUS
        - MALICIOUS
        - UNKNOWN
    ProcessingStatus:
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - PARTIAL
        - FAILED
        - BLOCKED
    SourceType:
      enum:
        - WEBSITE
        - ARTICLE
        - VIDEO
        - PLAYLIST
        - PDF
        - REPOSITORY
        - IMAGE
        - AUDIO
        - DOCUMENT
        - OTHER
    User:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        email_verified_at:
          type:
            - string
            - 'null'
          format: date-time
        avatar_url:
          type:
            - string
            - 'null'
        bio:
          type:
            - string
            - 'null'
        locale:
          enum:
            - ar
            - en
        theme:
          enum:
            - system
            - light
            - dark
        profile_public:
          type: boolean
        is_admin:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_mode:
          enum:
            - session
            - token
        token:
          type: string
        token_type:
          const: Bearer
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
    PublicUserSummary:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        avatar_url:
          type:
            - string
            - 'null'
        profile_url:
          type: string
    PublicUser:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        avatar_url:
          type:
            - string
            - 'null'
        bio:
          type:
            - string
            - 'null'
        profile_url:
          type: string
        joined_at:
          type: string
          format: date
        stats:
          type: object
          properties:
            public_links:
              type: integer
            public_collections:
              type: integer
    Session:
      type: object
      properties:
        id:
          type: string
        ip_address:
          type:
            - string
            - 'null'
        user_agent:
          type:
            - string
            - 'null'
        last_active_at:
          type:
            - string
            - 'null'
          format: date-time
        current:
          type: boolean
    ApiToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        current:
          type: boolean
    Processing:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        security:
          $ref: '#/components/schemas/SecurityStatus'
        extraction:
          type: string
        extraction_error_code:
          type:
            - string
            - 'null'
        ai:
          type: string
        ai_enabled:
          type: boolean
    PublicSavedLink:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        internal_path:
          type: string
          example: /l/0d9a…
        frontend_url:
          type: string
        access_role:
          enum:
            - owner
            - viewer
            - public
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        image_url:
          type:
            - string
            - 'null'
        favicon_url:
          type:
            - string
            - 'null'
        site_name:
          type:
            - string
            - 'null'
        hostname:
          type: string
        source_type:
          $ref: '#/components/schemas/SourceType'
        language:
          type:
            - string
            - 'null'
        author:
          type:
            - string
            - 'null'
        source_published_at:
          type:
            - string
            - 'null'
          format: date-time
        category:
          type:
            - object
            - 'null'
          properties:
            slug:
              type: string
            name:
              type: string
            name_ar:
              type: string
            name_en:
              type: string
        tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              slug:
                type: string
              source:
                enum:
                  - USER
                  - AI
                  - null
        ai:
          type:
            - object
            - 'null'
          description: 'AI-generated suggestions (clearly labelled)'
          properties:
            summary:
              type:
                - string
                - 'null'
            detailed_summary:
              type:
                - string
                - 'null'
            suggested_title:
              type:
                - string
                - 'null'
            suggested_category:
              type:
                - object
                - 'null'
              properties:
                slug:
                  type: string
                name:
                  type: string
                name_ar:
                  type: string
                name_en:
                  type: string
            suggested_tags:
              type: array
              items:
                type: string
            generated:
              const: true
        url:
          type:
            - string
            - 'null'
          description: 'Original URL; null when the policy forbids exposing it to this caller'
        open_url:
          type:
            - string
            - 'null'
          description: 'Destination the client may open; null when blocked'
        security:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/SecurityStatus'
            can_open:
              type: boolean
            warning:
              type:
                - string
                - 'null'
            checked_at:
              type:
                - string
                - 'null'
              format: date-time
        owner:
          oneOf:
            -
              $ref: '#/components/schemas/PublicUserSummary'
            -
              type: 'null'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
    SavedLink:
      description: 'Owner representation adds visibility, notes, overrides, extracted metadata, processing and permissions. Viewers additionally get shared_by and permissions.'
      allOf:
        -
          $ref: '#/components/schemas/PublicSavedLink'
        -
          type: object
          properties:
            visibility:
              $ref: '#/components/schemas/Visibility'
            allow_resharing:
              type: boolean
            is_favorite:
              type: boolean
            notes:
              type:
                - string
                - 'null'
            overrides:
              type: object
            extracted:
              type: object
            processing_status:
              $ref: '#/components/schemas/ProcessingStatus'
            processing:
              $ref: '#/components/schemas/Processing'
            shared_by:
              type:
                - string
                - 'null'
            permissions:
              type: object
              properties:
                can_edit:
                  type: boolean
                can_delete:
                  type: boolean
                can_change_visibility:
                  type: boolean
                can_publish:
                  type: boolean
                can_share:
                  type: boolean
                can_reshare:
                  type: boolean
            created_at:
              type:
                - string
                - 'null'
              format: date-time
            updated_at:
              type:
                - string
                - 'null'
              format: date-time
            deleted_at:
              type:
                - string
                - 'null'
              format: date-time
    Collection:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        frontend_url:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        cover_image_url:
          type:
            - string
            - 'null'
        items_count:
          type:
            - integer
            - 'null'
        owner:
          oneOf:
            -
              $ref: '#/components/schemas/PublicUserSummary'
            -
              type: 'null'
        visibility:
          $ref: '#/components/schemas/Visibility'
        sort_order:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedLink'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    Category:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        name_ar:
          type: string
        name_en:
          type: string
        description:
          type:
            - string
            - 'null'
        description_ar:
          type:
            - string
            - 'null'
        description_en:
          type:
            - string
            - 'null'
        parent_slug:
          type:
            - string
            - 'null'
        sort_order:
          type: integer
        is_active:
          type: boolean
          description: 'admins only'
        links_count:
          type: integer
          description: 'public endpoints only'
    Tag:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        links_count:
          type: integer
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          enum:
            - PENDING
            - ACCEPTED
            - REVOKED
            - EXPIRED
        invited_by:
          type: object
        via_reshare:
          type: boolean
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        accepted_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    ReceivedInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invited_by:
          type: object
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        grantee:
          type: object
        grantor:
          type: object
        parent_grant_id:
          type:
            - string
            - 'null'
        depth:
          type: integer
        status:
          enum:
            - ACTIVE
            - REVOKED
        effective:
          type: boolean
        revoke_reason:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
    SecurityScan:
      type: object
      properties:
        trigger:
          type: string
        status:
          type: string
        verdict:
          oneOf:
            -
              $ref: '#/components/schemas/SecurityStatus'
            -
              type: 'null'
        providers:
          type: array
          items:
            type: object
        error_code:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
    SecurityDetails:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SecurityStatus'
        stored_status:
          $ref: '#/components/schemas/SecurityStatus'
        source:
          enum:
            - PROVIDER
            - MANUAL_REVIEW
        checked_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        can_publish:
          type: boolean
        can_share:
          type: boolean
        can_open:
          type: boolean
        disclaimer:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/SecurityScan'
        appeals:
          type: array
          items:
            $ref: '#/components/schemas/Appeal'
    Appeal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        security_status_at_submission:
          $ref: '#/components/schemas/SecurityStatus'
        reason:
          type: string
        resolution_verdict:
          type:
            - string
            - 'null'
        reviewer_notes:
          type:
            - string
            - 'null'
        resolved_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          examples:
            - sharing.invitation_received
            - sharing.invitation_accepted
            - sharing.access_revoked
            - security.warning
            - processing.failed
            - account.password_changed
        data:
          type: object
        read:
          type: boolean
        read_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    AuditLog:
      type: object
      properties:
        id:
          type: integer
